[project]
name = "ibkr-half-day-reversal"
version = "1.2.6"
description = "Local IBKR dashboard for the half-day reversal strategy"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2025.1.31",
  "databento>=0.66",
  "exchange-calendars>=4.8",
  "fastapi>=0.116",
  "httpx>=0.28",
  "ib-async>=2.0.1",
  "pydantic>=2.11",
  "python-dotenv>=1.1",
  "uvicorn[standard]>=0.35",
  "websockets>=15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halfreversal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
