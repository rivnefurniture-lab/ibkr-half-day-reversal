name: Desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: chmod +x scripts/build_macos.sh && scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.architecture }}
          path: dist/Half-Day-Reversal-macOS-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --with pyinstaller pyinstaller --noconfirm --clean packaging/half_day_reversal.spec
      - run: choco install innosetup --no-progress -y
      - run: iscc packaging/windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/Half-Day-Reversal-Setup-Windows.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-installer*"
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installers/*
